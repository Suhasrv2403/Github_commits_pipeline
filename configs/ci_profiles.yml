# dbt connection profile used only in CI (.github/workflows/dbt_ci.yml),
# where it is copied to profiles.yml so `dbt compile` can resolve the
# CI_TESTING schema without a developer's local ~/.dbt/profiles.yml.
# Credentials are pulled from GitHub Actions secrets via env_var(), never
# hardcoded here.
ci_profile:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: COMPUTE_WH
      database: DE_SPEEDRUN
      schema: CI_TESTING
      threads: 1
      client_session_keep_alive: False
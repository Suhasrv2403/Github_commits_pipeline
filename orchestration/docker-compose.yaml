# Run from the repo root with:
#   docker compose --env-file .env -f orchestration/docker-compose.yaml up
# so that the ${...} substitutions below resolve from the same .env file
# used by src/extract.py and orchestration/dags/elt_dag.py (see .env.example).
# Generate a Fernet key with:
#   python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
version: '3'
services:
  airflow:
    build: .
    environment:
      # --- UPDATED CONFIGURATION ---
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env, see .env.example}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_ADMIN_USER=${AIRFLOW_ADMIN_USER:-admin}
      - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env, see .env.example}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../src:/opt/airflow/src
      - ../transform/my_pipeline:/opt/airflow/dbt
      - ~/.dbt:/opt/airflow/.dbt
      - ../.env:/opt/airflow/.env
    ports:
      - "8080:8080"
    # --- UPDATED COMMAND ---
    # We use 'db migrate' instead of 'db init', and we create the user safely.
    # Username/password read from the container env (set above from .env)
    # instead of being hardcoded.
    command: bash -c "airflow db migrate && airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname Peter --lastname Parker --role Admin --email spiderman@superhero.com && airflow webserver & airflow scheduler"
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow